name: Publish static demo

# Run manually after choosing Settings > Pages > Source > GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Test browser demo logic and interface
        run: npm run test:demo
      - name: Build static HTML, CSS, and JavaScript
        run: npm run build:demo
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only the static demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/demo

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
